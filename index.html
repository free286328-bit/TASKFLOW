'use strict';const KEY='taskflow-v1';const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const today=()=>iso(new Date());const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state||!Array.isArray(state.tasks))state={tasks:[],subjects:['선형대수학','논리적글쓰기','일반물리학','객체지향프로그래밍','미분적분학'],settings:{capacity:3,rest:[],review:1}};state.settings={capacity:3,rest:[],review:1,...state.settings};state.subjects=Array.isArray(state.subjects)?state.subjects:[];let page='home',filter='all',view='month',cursor=new Date(),selected=today(),editing=null;let persisted=JSON.stringify(state);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persisted=JSON.stringify(state);return true}catch{state=JSON.parse(persisted);alert('저장하지 못했습니다. 브라우저 저장 공간과 개인정보 보호 설정을 확인하고 다시 시도해 주세요.');return false}}function stepHours(t,s){if(!s.autoHours)return Number(s.hours)||0;const steps=t.steps||[],auto=steps.filter(x=>x.autoHours).length,explicit=steps.filter(x=>!x.autoHours).reduce((n,x)=>n+(Number(x.hours)||0),0);return auto?Math.max(0,(Number(t.hours)||0)-explicit)/auto:0}function remaining(t){return (t.steps||[]).length?t.steps.filter(s=>!s.done).reduce((a,s)=>a+stepHours(t,s),0):Number(t.hours)||0}function progress(t){if(t.status==='done')return 100;let ss=t.steps||[];return ss.length?Math.round(ss.filter(s=>s.done).length/ss.length*100):0}function score(t){if(t.status==='done')return -999;let d=daysBetween(today(),t.deadline),r=remaining(t),slack=Math.max(.5,d+1)*Number(state.settings.capacity||3);return Math.round(35/(Math.max(0,d)+1)+Math.min(35,r/slack*25)+({high:25,medium:12,low:3}[t.priority]||12)+(d<0?45:0))}function active(){return state.tasks.filter(t=>t.status!=='done')}function sorted(list){return [...list].sort((a,b)=>score(b)-score(a)||a.deadline.localeCompare(b.deadline))}function dateLabel(s){let d=daysBetween(today(),s);return d<0?`D+${-d}`:d===0?'D-DAY':`D-${d}`}function badge(t){let d=daysBetween(today(),t.deadline);return `<span class="pill ${d<=2?'urgent':d<=6?'soon':''}">${dateLabel(t.deadline)}</span>`}function head(title,desc){return `<div class="top"><div><div class="eyebrow">${esc(desc)}</div><h1>${esc(title)}</h1></div><button class="primary" onclick="openEditor()">+ 새 과제</button></div>`}const navs=[['home','⌂','홈'],['tasks','▤','과제'],['calendar','▦','캘린더'],['analytics','◷','분석'],['settings','⚙','설정']];const iconPaths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',tasks:'M5 4h14v17H5ZM9 3h6v4H9ZM8 11h8M8 15h8',calendar:'M3 5h18v16H3ZM3 10h18M8 3v4M16 3v4',analytics:'M4 20V12M11 20V4M18 20V8',settings:'M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0'};function navIcon(id){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${iconPaths[id]}"/></svg>`}function nav(){document.getElementById('desktopNav').innerHTML=navs.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${navIcon(id)} &nbsp; ${label}</button>`).join('');document.getElementById('mobileNav').innerHTML=navs.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${navIcon(id)}</b>${label}</button>`).join('')}function go(p){page=p;render();scrollTo(0,0)}function card(t){return `<div class="task"><div class="row"><div><span class="pill">${esc(t.subject)}</span> <span class="pill">${t.type==='team'?'조별활동':t.type==='project'?'장기 프로젝트':'일반 과제'}</span></div>${t.status==='done'?'<span class="pill good">완료</span>':badge(t)}</div><h3 style="margin-top:11px">${esc(t.title)}</h3><div class="muted mini">마감 ${esc(t.deadline)} · 남은 작업 ${remaining(t).toFixed(1)}시간 ${t.team?'· 팀: '+esc(t.team):''}</div><div class="progress"><i style="width:${progress(t)}%"></i></div><div class="row mini muted"><span>진행률 ${progress(t)}%</span><span>우선순위 ${score(t)>55?'높음':score(t)>25?'보통':'낮음'}</span></div><div class="btnrow"><button onclick="openEditor('${t.id}')">상세·수정</button>${t.status!=='done'?`<button onclick="finish('${t.id}')">✓ 완료</button>`:`<button onclick="reopen('${t.id}')">다시 열기</button>`}<button onclick="removeTask('${t.id}')">삭제</button></div></div>`}function plan(){
 const capacity=Math.round(Number(state.settings.capacity)*60)||180,rest=state.settings.rest||[],review=Number(state.settings.review)||0,alloc={},warnings=[];
 const jobs=sorted(active()).flatMap(t=>(t.steps?.length?t.steps.filter(s=>!s.done).map(s=>({task:t,title:s.title,due:s.due||t.deadline,hours:stepHours(t,s)})): [{task:t,title:'',due:t.deadline,hours:remaining(t)}]));

 for(const job of jobs){const t=job.task;let left=Math.round(job.hours*60);if(left<=0)continue;
 const start=t.start&&t.start>today()?t.start:today();let end=addDays(job.due,-review);if(end<start)end=job.due;
 const dates=[];for(let d=start,i=0;d<=end&&i<3660;d=addDays(d,1),i++)if(!rest.includes(new Date(d+'T12:00:00').getDay()))dates.push(d);

 const per=Math.ceil(left/dates.length);
 function assign(d,limit){const used=(alloc[d]||[]).reduce((a,x)=>a+x.minutes,0),m=Math.min(left,Math.max(0,capacity-used),limit);if(m>0){const list=alloc[d]||=[];let item=list.find(x=>x.task.id===t.id);if(!item){item={task:t,minutes:0,hours:0};list.push(item)}item.minutes+=m;item.hours=item.minutes/60;left-=m}}
 for(const d of dates)assign(d,per);for(const d of dates)assign(d,left);

function submitTask(e){e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(!v.title.trim()){alert('과제명을 입력해 주세요.');return}if(!v.start)v.start=today();if(v.start>v.deadline){alert('시작일은 마감일보다 늦을 수 없습니다.');return}if([...document.querySelectorAll('.stepRow')].some(el=>!el.querySelector('.stepTitle').value.trim()&&(el.querySelector('.stepOwner').value.trim()||el.querySelector('.stepDue').value||Number(el.querySelector('.stepHours').value)>0))){alert('세부 작업명을 입력해 주세요.');return}let steps=[...document.querySelectorAll('.stepRow')].map(el=>({id:el.dataset.id||uid(),title:el.querySelector('.stepTitle').value.trim(),owner:el.querySelector('.stepOwner').value.trim(),due:el.querySelector('.stepDue').value,hours:Number(el.querySelector('.stepHours').value)||0,autoHours:el.querySelector('.stepHours').value.trim()==='',done:el.querySelector('.stepDone').checked})).filter(s=>s.title);if(steps.some(s=>s.due&&(s.due<v.start||s.due>v.deadline))){alert('세부 작업 마감일은 프로젝트 기간 안에 있어야 합니다.');return}let old=state.tasks.find(t=>t.id===editing);let obj={...old,id:editing||uid(),title:v.title.trim(),subject:v.subject,type:v.type,start:v.start,deadline:v.deadline,priority:v.priority,hours:Number(v.hours)||0,team:v.team.trim(),note:v.note.trim(),steps,status:old?.status||'active',createdAt:old?.createdAt||new Date().toISOString()};if(editing)state.tasks=state.tasks.map(t=>t.id===editing?obj:t);else state.tasks.push(obj);if(!save())return;closeEditor();render()}function finish(id){let t=state.tasks.find(t=>t.id===id);if(t){t.status='done';t.completedAt=new Date().toISOString();t.completedDate=today();save();render()}}function reopen(id){let t=state.tasks.find(t=>t.id===id);if(t){t.status='active';delete t.completedAt;delete t.completedDate;save();render()}}function removeTask(id){if(confirm('이 과제를 삭제할까요? 삭제 후 복구하려면 백업 파일이 필요합니다.')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}}function saveSettings(){let c=Number(document.getElementById('capacity').value),r=Number(document.getElementById('review').value);if(!(c>=0.5&&c<=24&&Number.isInteger(c*2))||!(r>=0&&r<=7&&Number.isInteger(r))){alert('설정값을 확인해 주세요.');return}state.settings={capacity:c,review:r,rest:[...document.querySelectorAll('.rest:checked')].map(x=>Number(x.value))};if(!save())return;render();alert('설정이 저장되었습니다.')}function addSubject(){let x=document.getElementById('newSubject').value.trim();if(!x||state.subjects.includes(x))return alert('새 과목 이름을 확인해 주세요.');state.subjects.push(x);save();render()}function deleteSubject(i){if(state.tasks.some(t=>t.subject===state.subjects[i]))return alert('이 과목에 등록된 과제가 있어 삭제할 수 없습니다.');state.subjects.splice(i,1);save();render()}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`TASKFLOW-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function validBackup(obj){const date=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(new Date(s+'T12:00:00').getTime())&&iso(new Date(s+'T12:00:00'))===s;const hours=n=>Number.isFinite(n)&&n>=0&&n<=999;return obj&&Array.isArray(obj.tasks)&&Array.isArray(obj.subjects)&&obj.subjects.every(s=>typeof s==='string')&&obj.settings&&Number.isFinite(obj.settings.capacity)&&obj.settings.capacity>=.5&&obj.settings.capacity<=24&&Number.isInteger(obj.settings.capacity*2)&&Number.isInteger(obj.settings.review)&&obj.settings.review>=0&&obj.settings.review<=7&&Array.isArray(obj.settings.rest)&&obj.settings.rest.every(n=>Number.isInteger(n)&&n>=0&&n<=6)&&new Set(obj.tasks.map(t=>t?.id)).size===obj.tasks.length&&obj.tasks.every(t=>t&&typeof t.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(t.id)&&typeof t.title==='string'&&t.title.trim()&&typeof t.subject==='string'&&date(t.deadline)&&(!t.start||date(t.start)&&t.start<=t.deadline)&&hours(t.hours)&&['assignment','project','team'].includes(t.type)&&['active','done'].includes(t.status)&&Array.isArray(t.steps)&&t.steps.every(s=>s&&typeof s.title==='string'&&hours(s.hours)&&(!s.due||date(s.due)&&s.due<=t.deadline&&(!t.start||s.due>=t.start))))}
async function importData(e){let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!validBackup(obj))throw Error('형식 오류');if(confirm('현재 데이터를 백업 파일로 교체할까요?')){state=obj;if(save())render()}}catch{alert('올바른 TASKFLOW 백업 파일이 아닙니다.')}finally{e.target.value=''}}
function resetData(){if(confirm('모든 과제와 설정을 초기화할까요? 이 작업은 취소할 수 없습니다.')&&confirm('정말 초기화하시겠습니까?')){localStorage.removeItem(KEY);location.reload()}}
/* Long-press reordering: commit only on release; cancellation preserves the original order. */
let subjectDrag=null;
function endSubjectDrag(commit=false){
 const d=subjectDrag;if(!d)return;clearTimeout(d.timer);subjectDrag=null;
 if(d.active){if(commit){state.subjects=[...document.querySelectorAll('#subjectList .subject-row')].map(row=>d.subjects[Number(row.dataset.subjectIndex)]);save()}render()}
}
function beginSubjectDrag(target,x,y){
 const grip=target.closest('.subject-grip');if(!grip)return;
 endSubjectDrag();const row=grip.closest('.subject-row');
 const d=subjectDrag={row,x,y,active:false,subjects:[...state.subjects]};
 d.timer=setTimeout(()=>{if(subjectDrag!==d)return;d.active=true;row.classList.add('dragging');navigator.vibrate?.(20)},450);
}
function moveSubjectDrag(x,y,e){
 const d=subjectDrag;if(!d)return;
 if(!d.active){if(Math.hypot(x-d.x,y-d.y)>10)endSubjectDrag();return}
 if(e.cancelable)e.preventDefault();
 const rows=[...document.querySelectorAll('#subjectList .subject-row')];
 const next=rows.find(row=>row!==d.row&&y<row.getBoundingClientRect().top+row.getBoundingClientRect().height/2);
 const list=document.getElementById('subjectList');
 if(next)list.insertBefore(d.row,next);else list.appendChild(d.row);
 if(y<90)window.scrollBy(0,-12);else if(y>window.innerHeight-100)window.scrollBy(0,12);
}
document.addEventListener('touchstart',e=>{if(e.touches.length!==1){endSubjectDrag();return}const t=e.touches[0];beginSubjectDrag(e.target,t.clientX,t.clientY)},{passive:true});
document.addEventListener('touchmove',e=>{if(e.touches.length!==1){endSubjectDrag();return}const t=e.touches[0];moveSubjectDrag(t.clientX,t.clientY,e)},{passive:false});
document.addEventListener('touchend',()=>endSubjectDrag(true));
document.addEventListener('touchcancel',()=>endSubjectDrag());
document.addEventListener('mousedown',e=>{if(e.button===0)beginSubjectDrag(e.target,e.clientX,e.clientY)});
document.addEventListener('mousemove',e=>moveSubjectDrag(e.clientX,e.clientY,e));
document.addEventListener('mouseup',()=>endSubjectDrag(true));
window.addEventListener('blur',()=>endSubjectDrag());
document.addEventListener('contextmenu',e=>{if(e.target.closest('.subject-grip'))e.preventDefault()});
document.addEventListener('keydown',e=>{
 const grip=e.target.closest?.('.subject-grip');if(!grip||!['ArrowUp','ArrowDown'].includes(e.key))return;
 e.preventDefault();const i=Number(grip.closest('.subject-row').dataset.subjectIndex),j=i+(e.key==='ArrowUp'?-1:1);
 if(j<0||j>=state.subjects.length)return;
 [state.subjects[i],state.subjects[j]]=[state.subjects[j],state.subjects[i]];save();render();
 document.querySelectorAll('.subject-grip')[j]?.focus();
});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
render();
</script></body></html>
