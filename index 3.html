<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><title>TASKFLOW · 스마트 과제 매니저</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#20263a;background:#f7f8fc;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1240px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:100dvh}.side{padding:30px 18px;border-right:1px solid #e9ebf2;background:#fff;position:sticky;top:0;height:100dvh}.logo{font-size:22px;font-weight:850;letter-spacing:-1px;padding:4px 12px 35px}.logo span{color:#6366f1}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:14px 16px;border-radius:13px;color:#737b90;font-weight:650}.nav button.active{background:#eff0ff;color:#4f46e5}.main{padding:36px 42px 100px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{color:#858da0;font-size:12px;font-weight:700}h1{font-size:29px;letter-spacing:-1.1px;margin:7px 0}h2{font-size:17px;letter-spacing:-.4px;margin:0 0 16px}.muted{color:#8b93a6}.primary{background:#6159ec;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:750}.secondary{background:white;border:1px solid #e4e7ef;color:#40485b;border-radius:11px;padding:10px 13px}.danger{color:#c9445b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0 26px}.stat,.panel{background:white;border:1px solid #edf0f5;border-radius:19px;padding:21px;box-shadow:0 3px 14px #29365a06}.stat b{display:block;font-size:27px;margin-top:12px;letter-spacing:-1px}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.panel{margin-bottom:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.task{border:1px solid #edf0f5;border-radius:14px;padding:15px;margin:10px 0;background:white}.task h3{font-size:14px;margin:0 0 7px}.pill{display:inline-block;padding:5px 8px;background:#f0f1f6;border-radius:7px;color:#626b80;font-size:11px;font-weight:700}.urgent{background:#fff0ee;color:#d44d44}.soon{background:#fff6e6;color:#b57a18}.good{background:#eaf8f1;color:#258561}.progress{height:7px;background:#eff0f5;border-radius:8px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#7772ef;border-radius:8px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow button{padding:7px 10px;border-radius:8px;background:#f6f7fb;border:0;color:#50596e}.empty{padding:30px 12px;text-align:center;color:#9199aa}.tabs{display:flex;gap:8px;margin-bottom:17px;flex-wrap:wrap}.tabs button{border:1px solid #e5e8f0;background:white;border-radius:10px;padding:9px 13px;color:#737b8c}.tabs button.selected{background:#ecebff;color:#5148d8;border-color:#d8d5ff}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #eef0f5;border-radius:10px;min-height:87px;padding:8px;background:#fff;text-align:left;overflow:hidden}.day.other{opacity:.35}.day.today{border-color:#7772ef}.day.selected{background:#efeeff}.day small{font-weight:750}.dot{font-size:10px;background:#efeeff;color:#5149c9;border-radius:5px;padding:3px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weekday{text-align:center;color:#949bad;padding:10px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#687186}input,select,textarea{border:1px solid #e3e7ef;border-radius:10px;padding:12px;background:#fff;color:#222b3e;min-width:0;width:100%}textarea{resize:vertical;min-height:75px}.overlay{position:fixed;inset:0;background:#17213a7a;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{background:#fff;width:min(650px,100%);max-height:91dvh;overflow:auto;border-radius:22px;padding:25px}.modal h2{margin-bottom:20px}.section-title{font-size:12px;font-weight:800;color:#7e8799;text-transform:uppercase;letter-spacing:.6px;margin:22px 0 10px}.subtask{display:flex;gap:7px;align-items:center;margin:7px 0}.subtask input[type=checkbox]{width:18px}.subtask input[type=text]{flex:1}.subtask .tiny{width:110px}.notice{background:#f0efff;color:#5c56a2;padding:13px;border-radius:11px;font-size:12px;line-height:1.7}.warning{background:#fff5ed;color:#9b5d23}.mobile-nav{display:none}.bar{height:10px;background:#eeeefa;border-radius:8px;overflow:hidden;margin:9px 0}.bar>div{height:100%;background:#6e68e8}.list-line{padding:11px 0;border-bottom:1px solid #f0f1f5}.actions{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:12px}.check{width:18px;height:18px;accent-color:#625bed}.divider{border:0;border-top:1px solid #eef0f5;margin:16px 0}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:25px 18px 105px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9ebf2;z-index:10;padding:8px 4px max(8px,env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:#8b92a3;font-size:11px;padding:7px 5px;min-width:55px}.mobile-nav button.active{color:#5a52e8;font-weight:800}.mobile-nav b{display:block;font-size:20px;margin-bottom:3px}.day{min-height:65px;padding:5px}.dot{font-size:9px}.top h1{font-size:24px}}@media(max-width:460px){.stat,.panel{padding:16px}.stat b{font-size:24px}.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.modal{padding:18px}.top .primary{padding:11px}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">TASK<span>FLOW</span></div><nav class="nav" id="desktopNav"></nav><div class="muted mini" style="position:absolute;bottom:30px;left:30px">나의 대학 생활, 더 체계적으로.</div></aside><main class="main" id="app"></main></div><nav class="mobile-nav" id="mobileNav"></nav><div id="overlayRoot"></div><script>
'use strict';const KEY='taskflow-v1';const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const today=()=>iso(new Date());const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state||!Array.isArray(state.tasks))state={tasks:[],subjects:['선형대수학','논리적글쓰기','일반물리학','객체지향프로그래밍','미분적분학'],settings:{capacity:3,rest:[],review:1}};state.settings ||= {capacity:3,rest:[],review:1};let page='home',filter='all',view='month',cursor=new Date(),selected=today(),editing=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function remaining(t){return (t.steps||[]).length?t.steps.filter(s=>!s.done).reduce((a,s)=>a+(Number(s.hours)||0),0):Number(t.hours)||0}function progress(t){if(t.status==='done')return 100;let ss=t.steps||[];return ss.length?Math.round(ss.filter(s=>s.done).length/ss.length*100):0}function score(t){if(t.status==='done')return -999;let d=daysBetween(today(),t.deadline),r=remaining(t),slack=Math.max(.5,d+1)*Number(state.settings.capacity||3);return Math.round(35/(Math.max(0,d)+1)+Math.min(35,r/slack*25)+({high:25,medium:12,low:3}[t.priority]||12)+(d<0?45:0))}function active(){return state.tasks.filter(t=>t.status!=='done')}function sorted(list){return [...list].sort((a,b)=>score(b)-score(a)||a.deadline.localeCompare(b.deadline))}function dateLabel(s){let d=daysBetween(today(),s);return d<0?`D+${-d}`:d===0?'D-DAY':`D-${d}`}function badge(t){let d=daysBetween(today(),t.deadline);return `<span class="pill ${d<=2?'urgent':d<=6?'soon':''}">${dateLabel(t.deadline)}</span>`}function head(title,desc){return `<div class="top"><div><div class="eyebrow">${esc(desc)}</div><h1>${esc(title)}</h1></div><button class="primary" onclick="openEditor()">+ 새 과제</button></div>`}const navs=[['home','⌂','홈'],['tasks','▤','과제'],['calendar','▦','캘린더'],['analytics','◷','분석'],['settings','⚙','설정']];function nav(){document.getElementById('desktopNav').innerHTML=navs.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp; ${label}</button>`).join('');document.getElementById('mobileNav').innerHTML=navs.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${icon}</b>${label}</button>`).join('')}function go(p){page=p;render();scrollTo(0,0)}function card(t){return `<div class="task"><div class="row"><div><span class="pill">${esc(t.subject)}</span> <span class="pill">${t.type==='team'?'조별활동':t.type==='project'?'장기 프로젝트':'일반 과제'}</span></div>${t.status==='done'?'<span class="pill good">완료</span>':badge(t)}</div><h3 style="margin-top:11px">${esc(t.title)}</h3><div class="muted mini">마감 ${esc(t.deadline)} · 남은 작업 ${remaining(t).toFixed(1)}시간 ${t.team?'· 팀: '+esc(t.team):''}</div><div class="progress"><i style="width:${progress(t)}%"></i></div><div class="row mini muted"><span>진행률 ${progress(t)}%</span><span>우선순위 ${score(t)>55?'높음':score(t)>25?'보통':'낮음'}</span></div><div class="btnrow"><button onclick="openEditor('${t.id}')">상세·수정</button>${t.status!=='done'?`<button onclick="finish('${t.id}')">✓ 완료</button>`:`<button onclick="reopen('${t.id}')">다시 열기</button>`}<button onclick="removeTask('${t.id}')">삭제</button></div></div>`}function plan(){let ts=sorted(active());let capacity=Number(state.settings.capacity)||3,rest=state.settings.rest||[],review=Number(state.settings.review)||0,alloc={},warnings=[];for(let t of ts){let left=remaining(t);if(left<=0)continue;let start=t.start&&t.start>today()?t.start:today();let end=addDays(t.deadline,-review);if(end<start)end=t.deadline;let dates=[];for(let d=start,i=0;d<=end&&i<370;d=addDays(d,1),i++){if(!rest.includes(new Date(d+'T12:00:00').getDay()))dates.push(d)}if(!dates.length){warnings.push(`${t.title}: 작업 가능한 날짜가 없습니다.`);continue}let per=Math.ceil(left/dates.length*10)/10;for(let d of dates){if(left<=0)break;let used=(alloc[d]||[]).reduce((a,x)=>a+x.hours,0),room=Math.max(0,capacity-used),h=Math.min(left,room,per);if(h>0){(alloc[d]||=[]).push({task:t,hours:Math.round(h*10)/10});left=Math.round((left-h)*10)/10}}if(left>0){for(let d of dates){if(left<=0)break;let used=(alloc[d]||[]).reduce((a,x)=>a+x.hours,0),h=Math.min(left,Math.max(0,capacity-used));if(h>0){(alloc[d]||=[]).push({task:t,hours:Math.round(h*10)/10});left=Math.round((left-h)*10)/10}}}if(left>0)warnings.push(`${t.title}: 약 ${left.toFixed(1)}시간을 배분하지 못했습니다.`)}return {alloc,warnings}}function home(){let ts=active(),p=plan(),items=p.alloc[today()]||[];return head('오늘의 할 일','과제의 우선순위를 한눈에 확인하세요')+`<div class="cards"><div class="stat"><span class="muted">진행 중인 과제</span><b>${ts.length}</b></div><div class="stat"><span class="muted">7일 내 마감</span><b>${ts.filter(t=>daysBetween(today(),t.deadline)<=7).length}</b></div><div class="stat"><span class="muted">완료한 과제</span><b>${state.tasks.filter(t=>t.status==='done').length}</b></div><div class="stat"><span class="muted">오늘 계획</span><b>${items.reduce((a,x)=>a+x.hours,0).toFixed(1)}<small style="font-size:13px">시간</small></b></div></div><div class="grid"><div><section class="panel"><div class="row"><h2>✦ 스마트 추천 순서</h2><span class="muted mini">마감·작업량·중요도 반영</span></div>${ts.length?sorted(ts).slice(0,4).map(card).join(''):'<div class="empty">과제를 등록하면 우선순위를 추천해 드려요.</div>'}</section></div><div><section class="panel"><h2>오늘의 작업 계획</h2>${items.length?items.map(x=>`<div class="list-line"><b>${esc(x.task.title)}</b><div class="muted mini" style="margin-top:5px">${x.hours}시간 · ${esc(x.task.subject)}</div></div>`).join(''):'<div class="empty">오늘 배정된 작업이 없습니다.</div>'}<button class="secondary" style="margin-top:15px;width:100%" onclick="go('calendar')">캘린더에서 전체 계획 보기</button></section><section class="panel"><h2>계획 진단</h2>${p.warnings.length?p.warnings.map(w=>`<p class="notice warning">${esc(w)}</p>`).join(''):'<p class="notice">현재 설정한 하루 작업 가능 시간 내에서 작업 계획을 배분했습니다. 계획은 과제 변경 시 자동 재계산됩니다.</p>'}<p class="muted mini">추천 계획은 실제 완료 여부를 자동 추적하지 않습니다. 세부 작업 완료 상태를 업데이트해 주세요.</p></section></div></div>`}function tasksPage(){let arr=filter==='all'?state.tasks:filter==='active'?active():filter==='done'?state.tasks.filter(t=>t.status==='done'):state.tasks.filter(t=>t.type===filter);return head('나의 과제','일반 과제부터 장기 프로젝트, 조별활동까지')+`<div class="tabs">${[['all','전체'],['active','진행 중'],['project','프로젝트'],['team','조별활동'],['done','완료']].map(([v,l])=>`<button class="${filter===v?'selected':''}" onclick="filter='${v}';render()">${l}</button>`).join('')}</div><div class="grid"><section class="panel">${arr.length?sorted(arr).map(card).join(''):'<div class="empty">표시할 과제가 없습니다.</div>'}</section><section class="panel"><h2>프로젝트 관리 팁</h2><p class="muted" style="line-height:1.9">몇 주에 걸친 프로젝트는 <b>세부 작업</b>으로 나누고 각 단계에 담당자, 목표 날짜, 예상 시간을 입력해 보세요.</p><p class="notice">조별활동은 팀원의 담당 작업을 기록할 수 있지만, 실시간 공동 편집은 지원하지 않습니다.</p></section></div>`}function calendarPage(){let d=new Date(cursor),year=d.getFullYear(),month=d.getMonth(),p=plan();let heading=`${year}년 ${month+1}월`,start=new Date(year,month,1),offset=start.getDay(),count=new Date(year,month+1,0).getDate(),cells=[];for(let i=0;i<Math.ceil((offset+count)/7)*7;i++){let dt=new Date(year,month,1-offset+i),s=iso(dt),due=state.tasks.filter(t=>t.deadline===s),planned=p.alloc[s]||[];cells.push(`<button class="day ${dt.getMonth()!==month?'other':''} ${s===today()?'today':''} ${s===selected?'selected':''}" onclick="selected='${s}';render()"><small>${dt.getDate()}</small>${due.slice(0,2).map(t=>`<div class="dot">● ${esc(t.title)}</div>`).join('')}${planned.length?`<div class="dot" style="background:#eaf8f1;color:#248365">계획 ${planned.reduce((a,x)=>a+x.hours,0).toFixed(1)}h</div>`:''}</button>`)}let dateTasks=state.tasks.filter(t=>t.deadline===selected),datePlan=p.alloc[selected]||[];return head('캘린더','마감 일정과 자동 작업 계획을 함께 확인하세요')+`<section class="panel"><div class="row"><div class="actions"><button class="secondary" onclick="shift(-1)">‹</button><button class="secondary" onclick="shift(1)">›</button><button class="secondary" onclick="cursor=new Date();selected=today();render()">오늘</button></div><h2 style="margin:0">${heading}</h2></div><div class="tabs" style="margin-top:17px">${[['month','월간'],['week','주간'],['day','일간']].map(([v,l])=>`<button class="${view===v?'selected':''}" onclick="view='${v}';render()">${l}</button>`).join('')}</div>${view==='month'?`<div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div>`:view==='week'?weekHtml(p):dayHtml(p,selected)}</section><section class="panel"><h2>${selected} 상세 일정</h2><h3 class="mini">마감 과제</h3>${dateTasks.length?dateTasks.map(t=>`<div class="list-line">${esc(t.title)} <span class="muted">(${esc(t.subject)})</span></div>`).join(''):'<p class="muted">마감 과제가 없습니다.</p>'}<h3 class="mini">추천 작업</h3>${datePlan.length?datePlan.map(x=>`<div class="list-line">${esc(x.task.title)} · ${x.hours}시간</div>`).join(''):'<p class="muted">추천 작업이 없습니다.</p>'}</section>`}function weekHtml(p){let base=new Date(selected+'T12:00:00'),dow=base.getDay(),days=Array.from({length:7},(_,i)=>addDays(selected,i-dow));return `<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">${days.map(s=>`<button class="day ${s===selected?'selected':''}" onclick="selected='${s}';cursor=new Date('${s}T12:00:00');render()"><small>${s.slice(5)}</small><div class="dot">마감 ${state.tasks.filter(t=>t.deadline===s).length}</div><div class="dot">${(p.alloc[s]||[]).reduce((a,x)=>a+x.hours,0).toFixed(1)}h</div></button>`).join('')}</div>`}function dayHtml(p,s){return `<div class="row"><button class="secondary" onclick="selected=addDays(selected,-1);cursor=new Date(selected+'T12:00:00');render()">‹ 이전 날</button><b>${s}</b><button class="secondary" onclick="selected=addDays(selected,1);cursor=new Date(selected+'T12:00:00');render()">다음 날 ›</button></div><p class="muted">이날 배정된 작업 ${(p.alloc[s]||[]).reduce((a,x)=>a+x.hours,0).toFixed(1)}시간</p>`}function shift(n){if(view==='month')cursor.setMonth(cursor.getMonth()+n);else{selected=addDays(selected,n*(view==='week'?7:1));cursor=new Date(selected+'T12:00:00')}if(view==='month')selected=iso(cursor);render()}function analytics(){let all=state.tasks,done=all.filter(t=>t.status==='done'),rate=all.length?Math.round(done.length/all.length*100):0,ontime=done.length?Math.round(done.filter(t=>t.completedAt&&t.completedAt.slice(0,10)<=t.deadline).length/done.length*100):0;let subs=[...new Set(all.map(t=>t.subject))];return head('진행 분석','과제 수행 현황을 확인하세요')+`<div class="cards"><div class="stat"><span class="muted">전체 과제</span><b>${all.length}</b></div><div class="stat"><span class="muted">완료율</span><b>${rate}%</b></div><div class="stat"><span class="muted">기한 내 완료율</span><b>${ontime}%</b></div><div class="stat"><span class="muted">남은 작업량</span><b>${active().reduce((a,t)=>a+remaining(t),0).toFixed(1)}h</b></div></div><section class="panel"><h2>과목별 과제 현황</h2>${subs.length?subs.map(s=>{let a=all.filter(t=>t.subject===s),n=a.filter(t=>t.status==='done').length;return `<div class="list-line"><div class="row"><b>${esc(s)}</b><span class="muted mini">${n}/${a.length} 완료</span></div><div class="bar"><div style="width:${n/a.length*100}%"></div></div></div>`}).join(''):'<div class="empty">분석할 과제가 없습니다.</div>'}</section><p class="muted mini">기한 내 완료율은 앱에서 완료 처리한 날짜를 기준으로 합니다. 실제 제출 여부를 검증하지는 않습니다.</p>`}function settingsPage(){return head('설정','작업 계획과 데이터 관리')+`<div class="grid"><section class="panel"><h2>작업 계획 설정</h2><div class="field"><label>하루 최대 과제 작업 시간</label><input type="number" min="0.5" max="24" step="0.5" id="capacity" value="${state.settings.capacity}"></div><div class="field" style="margin-top:13px"><label>마감 전 검토용 여유 일수</label><input type="number" min="0" max="7" id="review" value="${state.settings.review}"></div><div class="section-title">작업하지 않는 요일</div><div class="actions">${['일','월','화','수','목','금','토'].map((d,i)=>`<label class="pill"><input style="width:auto" type="checkbox" class="rest" value="${i}" ${(state.settings.rest||[]).includes(i)?'checked':''}> ${d}</label>`).join('')}</div><button class="primary" style="margin-top:17px" onclick="saveSettings()">설정 저장</button></section><section class="panel"><h2>과목 관리</h2><div id="subjectList">${state.subjects.map((s,i)=>`<div class="list-line row"><span>${esc(s)}</span><button class="secondary danger" onclick="deleteSubject(${i})">삭제</button></div>`).join('')}</div><div class="row" style="margin-top:13px"><input id="newSubject" placeholder="새 과목 이름"><button class="primary" onclick="addSubject()">추가</button></div></section><section class="panel"><h2>데이터 백업 및 복원</h2><p class="muted mini">데이터는 현재 브라우저에 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 삭제하기 전에 백업하세요.</p><div class="actions"><button class="secondary" onclick="exportData()">JSON 백업 다운로드</button><label class="secondary" style="cursor:pointer">백업 불러오기<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div><hr class="divider"><button class="secondary danger" onclick="resetData()">모든 데이터 초기화</button></section><section class="panel"><h2>앱 정보</h2><p class="muted">TASKFLOW v1.0 · 오프라인 중심 개인 과제 관리 앱</p><p class="muted mini">실시간 팀 공동 편집, 푸시 알림, 기기 간 자동 동기화는 현재 지원하지 않습니다.</p></section></div>`}function render(){nav();document.getElementById('app').innerHTML=({home,tasks:tasksPage,calendar:calendarPage,analytics,settings:settingsPage}[page])()}
function openEditor(id){editing=id||null;let t=state.tasks.find(x=>x.id===id)||{title:'',subject:state.subjects[0]||'',type:'assignment',priority:'medium',start:today(),deadline:addDays(today(),7),hours:2,steps:[],team:'',note:''};document.getElementById('overlayRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeEditor()"><div class="modal"><div class="row"><h2>${id?'과제 수정':'새 과제 등록'}</h2><button class="secondary" onclick="closeEditor()">✕</button></div><form id="taskForm" onsubmit="submitTask(event)"><div class="formgrid"><div class="field wide"><label>과제명 *</label><input name="title" required maxlength="100" value="${esc(t.title)}" placeholder="예: PBL 최종 발표"></div><div class="field"><label>과목 *</label><select name="subject" required>${[...new Set([...state.subjects,t.subject])].map(s=>`<option ${s===t.subject?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>유형</label><select name="type">${[['assignment','일반 과제'],['project','장기 프로젝트'],['team','조별활동']].map(([v,l])=>`<option value="${v}" ${t.type===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>시작일</label><input name="start" type="date" value="${esc(t.start||today())}"></div><div class="field"><label>최종 마감일 *</label><input name="deadline" required type="date" value="${esc(t.deadline)}"></div><div class="field"><label>중요도</label><select name="priority">${[['high','높음'],['medium','보통'],['low','낮음']].map(([v,l])=>`<option value="${v}" ${t.priority===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>예상 소요 시간 (시간)</label><input name="hours" type="number" min="0" max="999" step="0.5" value="${Number(t.hours)||0}"></div><div class="field wide"><label>팀 이름 / 팀원 (선택)</label><input name="team" value="${esc(t.team||'')}" placeholder="예: PBL 1조"></div><div class="field wide"><label>메모</label><textarea name="note" placeholder="제출 조건, 교수님 안내 등">${esc(t.note||'')}</textarea></div></div><div class="section-title">세부 작업 · 담당자 · 중간 마감일</div><div id="stepsRoot"></div><button class="secondary" type="button" onclick="addStep()">+ 세부 작업 추가</button><p class="muted mini">세부 작업이 있으면 남은 예상 시간은 미완료 세부 작업의 시간 합계로 계산됩니다. 담당자는 기록용이며 실시간 공유되지 않습니다.</p><div class="row" style="margin-top:22px"><button class="secondary" type="button" onclick="closeEditor()">취소</button><button class="primary" type="submit">${id?'변경사항 저장':'과제 등록'}</button></div></form></div></div>`;(t.steps||[]).forEach(addStep);if(!t.steps?.length&&t.type!=='assignment')addStep()}function addStep(s={}){let div=document.createElement('div');div.className='task stepRow';div.innerHTML=`<div class="row"><label class="mini"><input type="checkbox" class="check stepDone" ${s.done?'checked':''}> 완료</label><button type="button" class="secondary danger" onclick="this.closest('.stepRow').remove()">삭제</button></div><div class="field" style="margin-top:9px"><label>작업명</label><input class="stepTitle" placeholder="예: 자료 조사" value="${esc(s.title||'')}"></div><div class="formgrid" style="margin-top:8px"><div class="field"><label>담당자</label><input class="stepOwner" placeholder="예: 나 / 팀원 이름" value="${esc(s.owner||'')}"></div><div class="field"><label>중간 마감일</label><input class="stepDue" type="date" value="${esc(s.due||'')}"></div><div class="field"><label>예상 시간</label><input class="stepHours" type="number" min="0" max="999" step="0.5" value="${Number(s.hours)||0}"></div></div>`;document.getElementById('stepsRoot').append(div)}function closeEditor(){document.getElementById('overlayRoot').innerHTML=''}function submitTask(e){e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(v.start>v.deadline){alert('시작일은 마감일보다 늦을 수 없습니다.');return}let steps=[...document.querySelectorAll('.stepRow')].map(el=>({id:uid(),title:el.querySelector('.stepTitle').value.trim(),owner:el.querySelector('.stepOwner').value.trim(),due:el.querySelector('.stepDue').value,hours:Number(el.querySelector('.stepHours').value)||0,done:el.querySelector('.stepDone').checked})).filter(s=>s.title);if(steps.some(s=>s.due&&(s.due<v.start||s.due>v.deadline))){alert('세부 작업 마감일은 프로젝트 기간 안에 있어야 합니다.');return}let old=state.tasks.find(t=>t.id===editing);let obj={...old,id:editing||uid(),title:v.title.trim(),subject:v.subject,type:v.type,start:v.start,deadline:v.deadline,priority:v.priority,hours:Number(v.hours)||0,team:v.team.trim(),note:v.note.trim(),steps,status:old?.status||'active',createdAt:old?.createdAt||new Date().toISOString()};if(editing)state.tasks=state.tasks.map(t=>t.id===editing?obj:t);else state.tasks.push(obj);save();closeEditor();render()}function finish(id){let t=state.tasks.find(t=>t.id===id);if(t){t.status='done';t.completedAt=new Date().toISOString();save();render()}}function reopen(id){let t=state.tasks.find(t=>t.id===id);if(t){t.status='active';delete t.completedAt;save();render()}}function removeTask(id){if(confirm('이 과제를 삭제할까요? 삭제 후 복구하려면 백업 파일이 필요합니다.')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}}function saveSettings(){let c=Number(document.getElementById('capacity').value),r=Number(document.getElementById('review').value);if(!(c>0&&c<=24)||!(r>=0&&r<=7)){alert('설정값을 확인해 주세요.');return}state.settings={capacity:c,review:r,rest:[...document.querySelectorAll('.rest:checked')].map(x=>Number(x.value))};save();render();alert('설정이 저장되었습니다.')}function addSubject(){let x=document.getElementById('newSubject').value.trim();if(!x||state.subjects.includes(x))return alert('새 과목 이름을 확인해 주세요.');state.subjects.push(x);save();render()}function deleteSubject(i){if(state.tasks.some(t=>t.subject===state.subjects[i]))return alert('이 과목에 등록된 과제가 있어 삭제할 수 없습니다.');state.subjects.splice(i,1);save();render()}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`TASKFLOW-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.subjects)||!obj.settings||typeof obj.settings!=='object'||obj.tasks.some(t=>!t.id||!t.title||!t.deadline))throw Error('형식 오류');if(confirm('현재 데이터를 백업 파일로 교체할까요?')){state=obj;save();render()}}catch{alert('올바른 TASKFLOW 백업 파일이 아닙니다.')}}function resetData(){if(confirm('모든 과제와 설정을 초기화할까요? 이 작업은 취소할 수 없습니다.')&&confirm('정말 초기화하시겠습니까?')){localStorage.removeItem(KEY);location.reload()}}render();
</script></body></html>
